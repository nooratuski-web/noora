<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MISTÉ Brand Collateral Preview</title>
  <style>
    @font-face {
      font-family: "Cormorant MISTE";
      src: url("/fonts/CormorantGaramond-Variable.ttf") format("truetype");
      font-weight: 300 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f3f0ea; color: #171615; }
    body { font-family: Arial, "Microsoft YaHei", sans-serif; }
    .hero-page {
      display: grid;
      grid-template-columns: 62% 38%;
      min-height: 100vh;
    }
    .hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: #d8cfc2;
    }
    .hero img {
      width: 100%;
      height: 100vh;
      display: block;
      object-fit: cover;
      object-position: center;
    }
    .content {
      min-width: 0;
      padding: clamp(44px, 5vw, 86px) clamp(42px, 5vw, 88px) 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .section-name {
      margin: 0 0 56px;
      font-size: 11px;
      letter-spacing: .12em;
    }
    h1 {
      max-width: 8em;
      margin: 0;
      font-family: "Cormorant MISTE", Georgia, serif;
      font-size: clamp(64px, 5vw, 92px);
      font-weight: 300;
      line-height: .84;
      letter-spacing: -.04em;
    }
    .cn-title {
      margin: 24px 0 0;
      font-size: 17px;
      letter-spacing: .1em;
    }
    .cards-page {
      min-height: 100vh;
      padding: clamp(52px, 7vh, 82px) clamp(36px, 6vw, 110px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .cards-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: clamp(70px, 11vh, 120px);
      font-size: 11px;
      letter-spacing: .14em;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(24px, 2.4vw, 46px);
      width: 100%;
    }
    .card { margin: 0; }
    .card img {
      width: 100%;
      display: block;
      box-shadow: 0 8px 18px rgba(66, 56, 45, .035);
    }
    @media (max-width: 900px) {
      .hero-page { display: block; }
      .hero, .hero img { min-height: 0; height: auto; }
      .hero img { width: 100%; object-fit: contain; }
      .content { padding: 56px 24px 80px; }
      .cards-page { min-height: auto; padding: 80px 24px; }
      .cards-label { margin-bottom: 48px; }
      .cards { grid-template-columns: 1fr 1fr; gap: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero-page">
      <div class="hero" aria-label="MISTÉ 品牌物料场景">
        <img src="/images/miste/collateral.png" alt="MISTÉ 香水品牌物料" />
      </div>
      <header class="content">
        <p class="section-name">05 / BRAND COLLATERAL</p>
        <h1>Objects of<br />Memory</h1>
        <p class="cn-title">品牌物料</p>
      </header>
    </section>

    <section class="cards-page">
      <div class="cards-label"><span>THE MEMORY COLLECTION</span><span>FOUR SCENTS</span></div>
      <div class="cards" aria-label="四款香水名片">
        <figure class="card"><img src="/previews/miste-namecards/01-kilig.png" alt="KILIG 香水名片" /></figure>
        <figure class="card"><img src="/previews/miste-namecards/02-serotinal.png" alt="SEROTINAL 香水名片" /></figure>
        <figure class="card"><img src="/previews/miste-namecards/03-reverie.png" alt="REVERIE 香水名片" /></figure>
        <figure class="card"><img src="/previews/miste-namecards/04-oblivion.png" alt="OBLIVION 香水名片" /></figure>
      </div>
    </section>
  </main>
</body>
</html>
