<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MISTÉ Form Study Preview</title>
  <style>
    @font-face {
      font-family: "Cormorant MISTE";
      src: url("/fonts/CormorantGaramond-Variable.ttf") format("truetype");
      font-weight: 300 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f3f0ea; color: #171615; }
    body { font-family: Arial, "Microsoft YaHei", sans-serif; }
    .study {
      width: min(1580px, calc(100% - clamp(56px, 9vw, 150px)));
      min-height: 100vh;
      margin: 0 auto;
      padding: 54px 0 92px;
      display: grid;
      grid-template-columns: .68fr 1.32fr;
      gap: clamp(56px, 7vw, 128px);
      align-items: start;
    }
    .masthead {
      padding-top: 0;
    }
    .section-name {
      margin: 0 0 70px;
      font-size: 12px;
      letter-spacing: .1em;
    }
    h1 {
      max-width: 8em;
      margin: clamp(115px, 16vh, 190px) 0 0;
      font-family: "Cormorant MISTE", Georgia, serif;
      font-size: clamp(86px, 7.6vw, 138px);
      font-weight: 300;
      line-height: .76;
      letter-spacing: -.045em;
    }
    .cn-title {
      margin: 28px 0 0;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: .08em;
    }
    .intro {
      max-width: 460px;
      margin: 56px 0 0;
      font-size: 15px;
      line-height: 2;
      letter-spacing: .03em;
    }
    .views {
      display: grid;
      grid-template-columns: 1.28fr .64fr .8fr;
      gap: clamp(24px, 3vw, 58px);
      align-items: end;
      margin-top: clamp(120px, 17vh, 200px);
    }
    .view { min-width: 0; }
    .visual {
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    .visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
    }
    .front .visual { height: 680px; }
    .side .visual { height: 420px; }
    .back .visual { height: 510px; }
    .index {
      margin: 24px 0 0;
      font-size: 11px;
      letter-spacing: .14em;
    }
    .detail {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(23, 22, 21, .28);
    }
    .detail h2 {
      margin: 0 0 12px;
      font-family: "Cormorant MISTE", Georgia, serif;
      font-size: 30px;
      font-weight: 400;
      line-height: 1;
    }
    .detail p {
      margin: 0;
      font-size: 13px;
      line-height: 1.8;
    }
    @media (max-width: 850px) {
      .study { width: calc(100% - 40px); padding-top: 32px; display: block; }
      .section-name { margin-bottom: 56px; }
      h1 { margin-top: 0; font-size: clamp(54px, 15vw, 78px); }
      .intro { margin-top: 38px; }
      .views { grid-template-columns: 1fr; gap: 90px; }
      .front .visual, .side .visual, .back .visual { width: min(520px, 100%); margin: 0 auto; }
    }
  </style>
</head>
<body>
  <main class="study">
    <header class="masthead">
      <div>
        <p class="section-name">04 / FORM STUDY</p>
        <h1>The bottle<br />as an archive</h1>
        <p class="cn-title">瓶体结构</p>
      </div>
      <p class="intro">扁平矩形瓶体以透明玻璃包裹独立照片夹层。正面磨砂前盖负责控制图像的清晰度，侧面展示夹层与储液腔之间的结构关系。</p>
    </header>

    <section class="views" aria-label="香水瓶三视图">
      <article class="view front">
        <div class="visual"><img src="/previews/miste-form-study/front.png" alt="MISTÉ 香水瓶正面" /></div>
        <p class="index">01 / FRONT</p>
      </article>

      <article class="view side">
        <div class="visual"><img src="/previews/miste-form-study/side.png" alt="MISTÉ 香水瓶侧面" /></div>
        <p class="index">02 / SIDE</p>
        <div class="detail">
          <h2>Frosted panel</h2>
          <p>通过顶部半圆缺口开启，让照片停留在清晰与模糊之间。</p>
        </div>
      </article>

      <article class="view back">
        <div class="visual"><img src="/previews/miste-form-study/back.png" alt="MISTÉ 香水瓶背面" /></div>
        <p class="index">03 / BACK</p>
        <div class="detail">
          <h2>Photo sleeve</h2>
          <p>照片夹层与香水储液腔分开，用于放置并更换私人照片。</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
