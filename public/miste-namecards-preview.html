<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MISTÉ Name Cards</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #ded6ca; color: #171615; }
    main { width: min(1440px, calc(100% - 64px)); margin: 0 auto; padding: 64px 0; }
    header { display: flex; justify-content: space-between; margin-bottom: 40px; font: 12px/1 Arial, sans-serif; letter-spacing: .12em; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
    figure { margin: 0; }
    img { display: block; width: 100%; box-shadow: 0 18px 36px rgba(55, 47, 38, .09); }
    @media (max-width: 760px) { main { width: calc(100% - 32px); padding: 32px 0; } .grid { grid-template-columns: 1fr; gap: 20px; } }
  </style>
</head>
<body>
  <main>
    <header><span>MISTÉ / NAME CARDS</span><span>04 PIECES</span></header>
    <div class="grid">
      <figure><img src="/previews/miste-namecards/01-kilig.png" alt="KILIG 名片" /></figure>
      <figure><img src="/previews/miste-namecards/02-serotinal.png" alt="SEROTINAL 名片" /></figure>
      <figure><img src="/previews/miste-namecards/03-reverie.png" alt="REVERIE 名片" /></figure>
      <figure><img src="/previews/miste-namecards/04-oblivion.png" alt="OBLIVION 名片" /></figure>
    </div>
  </main>
</body>
</html>
